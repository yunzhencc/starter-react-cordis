- id: i18n
  name: '@yunzhen/cordis-ui-i18n'
- id: renderer
  name: '@yunzhen/cordis-ui-renderer'
- id: layout
  name: '@yunzhen/cordis-ui-layout'
- id: router
  name: '@yunzhen/cordis-ui-router'
- id: theme
  name: '@yunzhen/cordis-ui-theme'
- id: models
  name: '@examples/agent-models'
  config:
    defaultModel: deepseek-chat
    models:
      - id: openai-gpt-4.1
        label: OpenAI GPT-4.1
        provider: openai
        baseURL: https://api.openai.com/v1
        model: gpt-4.1
      - id: deepseek-chat
        label: DeepSeek Chat
        provider: deepseek
        baseURL: https://api.deepseek.com/v1
        model: deepseek-chat
      - id: qwen-plus
        label: Qwen Plus
        provider: qwen
        baseURL: https://dashscope.aliyuncs.com/compatible-mode/v1
        model: qwen-plus
- id: chat
  name: '@examples/agent-chat'
- id: dashboard
  name: '@examples/agent-dashboard'
- id: settings-layout
  name: '@examples/agent-settings-layout'
- id: settings-general
  name: '@examples/agent-settings-general'
- id: settings-appearance
  name: '@examples/agent-settings-appearance'
- id: settings-language
  name: '@examples/agent-settings-language'
